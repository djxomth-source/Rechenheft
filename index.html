<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechenheft</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rechenheft">
<meta name="theme-color" content="#1D4F91">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bar:#1D4F91; --bar-ink:#FFFFFF; --bar-soft:rgba(255,255,255,.14);
  --ribbon:#F4F6FA; --ribbon-line:#D3DAE5; --ribbon-hover:#E4EAF3;
  --ws:#DCE1E8; --ui-ink:#1C2430; --muted:#5A6577; --accent:#1D4F91; --accent-soft:#E2EBF8;
  --danger:#B3261E; --ok:#1E7A46; --field:#FFFFFF; --field-line:#BCC6D4;
  --paper:#FFFFFF; --ink:#1B2A6B; --shadow:0 1px 3px rgba(20,30,50,.18),0 6px 18px rgba(20,30,50,.10);
  --font-ui:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bar:#15345F; --bar-soft:rgba(255,255,255,.10);
    --ribbon:#232A34; --ribbon-line:#353E4C; --ribbon-hover:#2E3744;
    --ws:#161A21; --ui-ink:#E5EAF1; --muted:#9BA6B6; --accent:#86AEEA; --accent-soft:#223856;
    --danger:#F08A82; --ok:#6FCF97; --field:#1B2029; --field-line:#3C4655;
    --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bar:#15345F; --bar-soft:rgba(255,255,255,.10);
  --ribbon:#232A34; --ribbon-line:#353E4C; --ribbon-hover:#2E3744;
  --ws:#161A21; --ui-ink:#E5EAF1; --muted:#9BA6B6; --accent:#86AEEA; --accent-soft:#223856;
  --danger:#F08A82; --ok:#6FCF97; --field:#1B2029; --field-line:#3C4655;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.35);
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ws);color:var(--ui-ink);font-family:var(--font-ui);font-size:14px;-webkit-text-size-adjust:100%;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Titelleiste */
.titlebar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:8px;padding:6px 16px;min-height:40px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.brand svg{flex:none}
.qa{display:flex;gap:2px}
.qa button,.tb-btn{background:transparent;border:0;border-radius:4px;padding:6px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--bar-ink)}
.qa button:hover,.tb-btn:hover{background:var(--bar-soft)}
.qa button:disabled{opacity:.4;cursor:default}
.doctitle{flex:1;min-width:0;display:flex;justify-content:center}
.doctitle input{background:transparent;border:1px solid transparent;border-radius:4px;color:var(--bar-ink);font:inherit;text-align:center;padding:4px 8px;width:min(340px,100%)}
.doctitle input:hover,.doctitle input:focus{border-color:rgba(255,255,255,.35);background:var(--bar-soft);outline:none}

/* Tabs + Ribbon */
.tabs{background:var(--bar);display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;color:var(--bar-ink);opacity:.85;padding:7px 14px 8px;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;font-size:13px}
.tab:hover{opacity:1;background:var(--bar-soft)}
.tab[aria-selected="true"]{background:var(--ribbon);color:var(--ui-ink);opacity:1;font-weight:500}
.ribbon{background:var(--ribbon);border-bottom:1px solid var(--ribbon-line);padding:6px 12px 4px;overflow-x:auto}
.panel{display:flex;gap:0;align-items:stretch;min-height:74px}
.panel[hidden]{display:none!important}
.group{display:flex;flex-direction:column;justify-content:space-between;padding:0 10px;border-right:1px solid var(--ribbon-line)}
.group:last-child{border-right:0}
.group-body{display:flex;gap:4px;align-items:center;flex:1}
.group-label{font-size:11px;color:var(--muted);text-align:center;padding-top:3px;letter-spacing:.02em;white-space:nowrap}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:58px;padding:5px 6px;background:transparent;border:1px solid transparent;border-radius:4px;cursor:pointer;font-size:12px;line-height:1.15;white-space:nowrap}
.big:hover{background:var(--ribbon-hover);border-color:var(--ribbon-line)}
.big.warn{color:var(--danger);border-color:var(--danger)}
.big svg{width:24px;height:24px}
.stack{display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.row .lbl{color:var(--muted);min-width:0}
.seg{display:inline-flex;border:1px solid var(--field-line);border-radius:4px;overflow:hidden;background:var(--field)}
.seg button{border:0;background:transparent;padding:3px 9px;cursor:pointer;font-size:12px;min-width:28px}
.seg button+button{border-left:1px solid var(--field-line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0f1a2b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0f1a2b}}
.num{font-variant-numeric:tabular-nums;min-width:18px;text-align:center}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--field);box-shadow:0 0 0 1px var(--field-line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}

/* Menü */
.menu{position:fixed;z-index:30;background:var(--field);border:1px solid var(--ribbon-line);border-radius:6px;box-shadow:var(--shadow);padding:6px;max-height:60vh;overflow:auto;min-width:260px;max-width:calc(100vw - 32px)}
.menu h4{margin:8px 8px 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:4px;cursor:pointer}
.menu button:hover{background:var(--accent-soft)}
.menu small{display:block;font-family:var(--font-mono);color:var(--muted);font-size:11px;margin-top:2px;white-space:normal}

/* Dock unten */
.fx{background:var(--ribbon);border-top:1px solid var(--ribbon-line);padding:6px 16px;display:flex;flex-direction:column;gap:6px}
.fx-row{display:flex;gap:8px;align-items:center}
.write-btn{flex:none;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:7px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
:root[data-theme="dark"] .write-btn{color:#0f1a2b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .write-btn{color:#0f1a2b}}
.sel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;background:var(--accent-soft);border-radius:4px;padding:4px 6px}
.sel b{font-weight:600;margin-right:6px}
.sel button{border:1px solid var(--field-line);background:var(--field);border-radius:4px;padding:3px 10px;cursor:pointer;font-size:12px}
.sel button.danger{color:var(--danger)}
.fx-main{display:flex;gap:8px;align-items:flex-start}
.fx-tag{font-family:var(--font-mono);font-style:italic;color:var(--muted);padding:8px 2px 0;user-select:none}
.fx textarea{flex:1;min-width:0;resize:none;border:1px solid var(--field-line);border-radius:4px;background:var(--field);color:var(--ui-ink);font-family:var(--font-mono);font-size:15px;line-height:1.45;padding:7px 10px;min-height:38px;max-height:132px}
.solve{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
:root[data-theme="dark"] .solve{color:#0f1a2b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .solve{color:#0f1a2b}}
.solve:hover{filter:brightness(1.08)}
.symbols{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px;flex:1;min-width:0}
.symbols button{flex:none;min-width:34px;height:30px;border:1px solid var(--field-line);background:var(--field);border-radius:4px;cursor:pointer;font-size:15px}
.symbols button:hover{background:var(--accent-soft)}
.msg{font-size:13px;line-height:1.4;color:var(--danger)}
.msg.ok{color:var(--ok)}

/* Schreibzone auf dem Papier */
.zone{position:absolute;border:1.5px dashed rgba(47,111,214,.45);border-radius:6px;background:rgba(47,111,214,.035);transition:border-color .2s,background .2s}
.zone:focus-within{border-color:rgba(47,111,214,.8);background:rgba(47,111,214,.06)}
.zone textarea{display:block;width:100%;box-sizing:border-box;border:0;outline:none;background:transparent;resize:none;font-family:"Caveat","Bradley Hand","Segoe Print",cursive;font-weight:500;color:var(--ink);caret-color:var(--ink);padding:.15em .3em 1.9em;overflow:hidden}
.zone textarea::placeholder{color:rgba(27,42,107,.38)}
.zone-tag{position:absolute;top:-1.55em;left:0;font:500 11px/1 var(--font-ui);color:#2F6FD6;background:var(--paper);padding:2px 4px;border-radius:3px;white-space:nowrap}
.zone-go{position:absolute;right:6px;bottom:6px;background:#1D4F91;color:#fff;border:0;border-radius:999px;padding:6px 14px;font:600 13px var(--font-ui);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.zone-go:hover{filter:brightness(1.1)}
.zone.sink textarea{animation:sink .45s ease-in forwards}
@keyframes sink{to{opacity:0;filter:blur(3px);transform:translateY(2px)}}
.draw{transition:stroke-dashoffset var(--dur,1.6s) linear}

/* Arbeitsfläche */
.ws{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-block:20px 40px;padding-inline:16px;position:relative}
.pages{display:flex;flex-direction:column;align-items:center;gap:20px}
.page{background:var(--paper);box-shadow:var(--shadow);position:relative;max-width:100%}
.page svg{display:block;width:100%;height:auto}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:rgba(29,79,145,.05)}
.hit.on{fill:rgba(29,79,145,.07);stroke:#2F6FD6;stroke-width:.4;stroke-dasharray:1.6 1.2}
.empty{max-width:520px;text-align:center;color:var(--muted);line-height:1.5;margin:0 auto}

/* Statusleiste */
.status{background:var(--ribbon);border-top:1px solid var(--ribbon-line);display:flex;align-items:center;gap:14px;padding:4px 16px;font-size:12px;color:var(--muted);min-height:28px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
.status .sp{flex:1}
.status button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:3px}
.status button:hover{background:var(--ribbon-hover);color:var(--ui-ink)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ui-ink);color:var(--ws);padding:9px 14px;border-radius:6px;font-size:13px;box-shadow:var(--shadow);z-index:40;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px)}
.toast button{background:transparent;border:0;color:var(--ws);text-decoration:underline;cursor:pointer;font-weight:600}

/* Hilfe */
.help{position:fixed;inset:0;z-index:35;background:rgba(15,22,34,.45);display:flex;justify-content:flex-end}
.help-card{background:var(--field);width:min(460px,100%);height:100%;overflow:auto;padding:20px 20px 40px;box-shadow:var(--shadow)}
.help-card h2{font-size:18px;margin:0 0 4px;text-wrap:balance}
.help-card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px;font-weight:500}
.help-card p{line-height:1.5;margin:6px 0;max-width:62ch}
.help-card code,.ex{font-family:var(--font-mono);font-size:12.5px}
.ex{display:block;width:100%;text-align:left;border:1px solid var(--field-line);background:var(--ribbon);border-radius:4px;padding:6px 8px;margin:4px 0;cursor:pointer;white-space:normal;line-height:1.4}
.ex:hover{border-color:var(--accent)}
.close{float:right;border:1px solid var(--field-line);background:var(--ribbon);border-radius:4px;padding:4px 10px;cursor:pointer}

@media (max-width:640px){
  .doctitle{display:none}
  .fx-tag{display:none}
  .big{min-width:50px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .titlebar,.tabs,.ribbon,.fx,.status{display:none}
  body,#app{overflow:visible;height:auto;background:#fff}
  .ws{overflow:visible;padding:0}
  .pages{gap:0}
  .page{box-shadow:none;width:210mm!important;page-break-after:always}
  .hit{display:none}
}
</style>

</head>
<body>
<div id="app">
  <header class="titlebar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="1.5" width="14" height="17" rx="1.5" fill="#fff"/><path d="M6 7h8M6 10h8" stroke="#1D4F91" stroke-width="1" /><path d="M6 13.2h6M6 15.2h6" stroke="#1D4F91" stroke-width="1.1" stroke-linecap="round"/></svg>
      <span>Rechenheft</span>
    </div>
    <div class="qa">
      <button id="undo" title="Rückgängig" aria-label="Rückgängig"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button id="redo" title="Wiederholen" aria-label="Wiederholen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <div class="doctitle"><input id="docTitle" aria-label="Dokumentname" value="Mathe Hausaufgaben"></div>
    <button class="tb-btn" id="qaPdf" title="Als PDF exportieren"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span>PDF</span></button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Menüband">
    <button class="tab" role="tab" data-tab="datei" aria-selected="false">Datei</button>
    <button class="tab" role="tab" data-tab="start" aria-selected="true">Start</button>
    <button class="tab" role="tab" data-tab="einfuegen" aria-selected="false">Einfügen</button>
    <button class="tab" role="tab" data-tab="ansicht" aria-selected="false">Ansicht</button>
    <button class="tab" role="tab" data-tab="hilfe" aria-selected="false">Hilfe</button>
  </nav>

  <section class="ribbon" aria-label="Werkzeuge">
    <div class="panel" data-panel="datei" hidden>
      <div class="group"><div class="group-body">
        <button class="big" id="bNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 2.5h8l4 4v15H6z"/><path d="M14 2.5v4h4"/><path d="M12 11v6M9 14h6" stroke-linecap="round"/></svg><span id="bNewLbl">Neu</span></button>
        <button class="big" id="bOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 7h6l2 2h10v10H3z"/><path d="M3 7V5h6"/></svg><span>Öffnen</span></button>
        <button class="big" id="bSave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span>Speichern</span></button>
      </div><div class="group-label">Rechenheft-Datei</div></div>
      <div class="group"><div class="group-body">
        <button class="big" id="bPdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 2.5h8l4 4v15H6z"/><path d="M14 2.5v4h4"/><text x="12" y="17.5" font-size="6" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="700">PDF</text></svg><span>PDF</span></button>
        <button class="big" id="bDocx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 2.5h8l4 4v15H6z"/><path d="M14 2.5v4h4"/><text x="12" y="17.5" font-size="5.2" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="700">DOCX</text></svg><span>Word</span></button>
      </div><div class="group-label">Exportieren (A4)</div></div>
    </div>

    <div class="panel" data-panel="start">
      <div class="group"><div class="group-body stack">
        <div class="row"><span class="lbl">Grösse</span><span class="seg" id="segSize"><button data-v="S">S</button><button data-v="M">M</button><button data-v="L">L</button></span></div>
        <div class="row"><span class="lbl">Tinte</span>
          <button class="swatch" data-ink="blue" style="background:#1B2A6B" aria-label="Blau"></button>
          <button class="swatch" data-ink="black" style="background:#1A1A1A" aria-label="Schwarz"></button>
          <button class="swatch" data-ink="pencil" style="background:#55595F" aria-label="Bleistift"></button>
        </div>
      </div><div class="group-label">Handschrift</div></div>
      <div class="group"><div class="group-body stack">
        <div class="row"><span class="lbl">Nachkommastellen</span><span class="seg"><button id="decMinus" aria-label="weniger">−</button><button class="num" id="decVal" disabled>2</button><button id="decPlus" aria-label="mehr">+</button></span></div>
        <div class="row"><span class="lbl">Dezimal</span><span class="seg" id="segSep"><button data-v=",">3,14</button><button data-v=".">3.14</button></span>
          <span class="lbl">Winkel</span><span class="seg" id="segAng"><button data-v="deg">Grad</button><button data-v="rad">rad</button></span></div>
      </div><div class="group-label">Rechnen</div></div>
      <div class="group"><div class="group-body stack">
        <div class="row"><span class="seg" id="segPaper"><button data-v="grid">Kariert</button><button data-v="lined">Liniert</button><button data-v="blank">Leer</button></span></div>
        <div class="row"><span class="lbl">Papier wird mit exportiert</span></div>
      </div><div class="group-label">Papier</div></div>
    </div>

    <div class="panel" data-panel="einfuegen" hidden>
      <div class="group"><div class="group-body">
        <button class="big" id="bExamples"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 5h16M4 10h10M4 15h16M4 20h8"/></svg><span>Aufgabe ▾</span></button>
      </div><div class="group-label">Vorlagen</div></div>
      <div class="group"><div class="group-body">
        <button class="big" id="bNote"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 18c3-6 5-9 6-9s-1 7 1 7 3-6 5-6 1 5 4 5"/></svg><span>Notiz</span></button>
        <button class="big" id="bGap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h16M4 18h16"/><path d="M12 9v6M9.5 11.5 12 9l2.5 2.5M9.5 12.5 12 15l2.5-2.5"/></svg><span>Leerzeile</span></button>
        <button class="big" id="bBreak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 3v6h12V3M6 21v-6h12v6"/><path d="M3 12h3M9 12h2M13 12h2M18 12h3"/></svg><span>Seitenumbruch</span></button>
      </div><div class="group-label">Auf dem Blatt</div></div>
    </div>

    <div class="panel" data-panel="ansicht" hidden>
      <div class="group"><div class="group-body">

      it = it.replace(/[?=\s]/g, '');
      const low = it.toLowerCase();
      if (/^(alle|allefehlenden(stücke|grössen)?|rest|fehlende.*)$/.test(low)) { targets.push(...['a', 'b', 'c', 'alpha', 'beta', 'gamma'].filter(x => K[x] === undefined)); continue; }
      if (/fläche|flaeche|inhalt/.test(low)) { targets.push('A'); continue; }
      if (/umfang/.test(low)) { targets.push('U'); continue; }
      if (/^h_?c?$/.test(low) || low === 'hc') { targets.push('hc'); continue; }
      if (/^h_?a$/.test(low)) { targets.push('ha'); continue; }
      if (/^h_?b$/.test(low)) { targets.push('hb'); continue; }
      let n = NAME_MAP[low] || NAME_MAP[it] || it; if (n === 'F') { n = 'A'; areaName = 'F'; }
      if (!TRI_NAMES.has(n)) throw new NotUnderstood('Gesuchte Grösse «' + it + '» nicht bekannt.');
      targets.push(n);
    }
    if (!targets.length) targets = ['a', 'b', 'c', 'alpha', 'beta', 'gamma'].filter(x => K[x] === undefined);
    targets = [...new Set(targets)];

    // geg./ges.-Zeilen
    const u = unit, u2 = unit ? unit + '²' : '';
    const gegTxt = givenList.map(({ n, a, auto }) => (auto ? 'γ = 90° (rechtwinklig)' : ANG.includes(n) ? `${G[n]} = ${deg(a.val)}` : n === 'A' ? `${areaName} = ${D(a.val)}${u2 ? ' ' + u2 : ''}` : `${nm(n)} = ${D(a.val)}${u ? ' ' + u : ''}`)).join(';  ');
    out.geg(gegTxt);
    out.ges(targets.map(n => (n === 'A' ? areaName : nm(n))).join(';  '));

    // Plausibilität
    const kAng = ANG.filter(x => K[x] !== undefined);
    if (kAng.length === 3 && Math.abs(K.alpha + K.beta + K.gamma - 180) > 1e-6) throw new Unsolvable(`Kein Dreieck möglich: α + β + γ = ${deg(K.alpha + K.beta + K.gamma)} ≠ 180°.`);
    const kSides = SIDE.filter(x => K[x] !== undefined).length + (K.A !== undefined ? 1 : 0) + (K.U !== undefined ? 1 : 0);
    const pieces = Object.keys(K).filter(k => ['a', 'b', 'c', 'alpha', 'beta', 'gamma', 'A', 'U'].includes(k)).length;
    const indepPieces = pieces - (kAng.length === 3 ? 1 : 0);
    if (kSides === 0) throw new Unsolvable('Es ist keine Seite gegeben. Mit Winkeln allein ist nur die Form des Dreiecks bestimmt, nicht seine Grösse.', 'Es fehlt mindestens eine Seite (a, b oder c).');
    if (indepPieces < 3) throw new Unsolvable(`Es sind nur ${indepPieces} unabhängige Stücke gegeben. Für ein Dreieck braucht es 3 (darunter mindestens eine Seite).`, `Es fehlt ${3 - indepPieces === 1 ? 'eine weitere Angabe' : 'es fehlen ' + (3 - indepPieces) + ' Angaben'} (z. B. eine Seite oder ein Winkel).`);

    const ctx = { unit, areaName };
    // Vorwärtsrechnen (mit Verzweigung)
    function run(K0) {
      const K = Object.assign({}, K0); const der = {}; let branchInfo = null;
      for (let guard = 0; guard < 40; guard++) {
        if (targets.every(t => K[t] !== undefined)) break;
        const cand = triangleRules(K, ctx);
        if (!cand.length) break;
        const c = cand.find(x => targets.includes(x.n)) || cand[0];
        K[c.n] = c.v; der[c.n] = c;
        if (c.branch && !branchInfo) branchInfo = { K: Object.assign({}, K, { [c.n]: c.branch.v }), der: Object.assign({}, der), c };
      }
      return { K, der, branchInfo };
    }
    function emit(res, skipLines) {
      const need = []; const seen = new Set();
      const visit = n => { if (seen.has(n)) return; seen.add(n); const d = res.der[n]; if (!d) return; d.deps.forEach(visit); need.push(n); };
      targets.forEach(visit);
      const printed = [];
      for (const n of need) {
        const d = res.der[n];
        const key = d.lines.join('|') + d.res;
        if (skipLines && skipLines.has(key)) continue;
        printed.push(key);
        const isT = targets.includes(n);
        out.l(`${d.title}:`);
        d.lines.forEach(t => out.l(t, 1));
        if (d.branchNote) out.l(d.branchNote, 1);
        out.res(isT ? uu(d.res) : d.res, 1);
      }
      return new Set(printed);
    }
    const r1 = run(K);
    const missing = targets.filter(t => r1.K[t] === undefined);
    if (missing.length) throw new Unsolvable(`${missing.map(nm).join(', ')} lässt sich mit diesen Angaben nicht berechnen.`, 'Prüfe die Angaben: Es fehlt eine passende Seite oder ein Winkel.');
    let r2 = null;
    if (r1.branchInfo) {
      // zweite Lösung weiterrechnen
      const bi = r1.branchInfo; const K2 = bi.K; const der2 = Object.assign({}, bi.der);
      der2[bi.c.n] = Object.assign({}, bi.c, { v: bi.c.branch.v, lines: [], title: `${bi.c.title} (2. Lösung)`, branchNote: bi.c.branch.note, res: `${nm(bi.c.n)}' ${rel(bi.c.branch.v)} ${deg(bi.c.branch.v)}` });
      const rr = run(K2); Object.keys(der2).forEach(k => { if (!(k in rr.der)) rr.der[k] = der2[k]; });
      rr.der[bi.c.n] = der2[bi.c.n];
      if (targets.every(t => rr.K[t] !== undefined)) r2 = rr;
    }
    if (r2) { out.note('Achtung: Diese Angaben ergeben 2 Dreiecke.'); out.l('\\ul{Lösung 1}'); }
    const printed = emit(r1);
    if (r2) { out.l('\\ul{Lösung 2}'); emit(r2, printed); }
  }

  // =================================================================
  // Modul: Polynom-Nullstellen (mit Rechenweg)
  // =================================================================
  // Löst p(x) = 0; schreibt Rechenweg; gibt Array der reellen Lösungen (sortiert)
  function solvePoly(p, out, v = 'x', ind = 0) {
    p = pTrim(p); const d = pDeg(p);
    const L = t => out.l(t, ind);
    if (d <= 0) { if (Math.abs(p[0]) < 1e-12) { L('Gleichung gilt für alle x.'); return null; } L(`${F(p[0])} = 0 ist falsch ⇒ keine Lösung.`); return []; }
    if (d === 1) {
      const [q, m] = p; const x = -q / m;
      if (Math.abs(q) < 1e-12) { L(`${polyMk(p, v)} = 0 ⇒ ${v} = 0`); return [0]; }
      L(`${polyMk(p, v)} = 0`); L(`${polyMk([0, m], v)} = ${F(-q)}`);
      if (Math.abs(m - 1) > 1e-12) { if (isInt(m) && isInt(q)) L(`${v} = \\frac{${F(-q)}}{${F(m)}}${F(x) !== `\\frac{${F(-q)}}{${F(m)}}` ? ' = ' + F(x) : ''}`); else L(`${v} = ${F(-q)} : ${PF(m)} ${relF(x)} ${F(x)}`); }
      return [x];
    }
    if (d === 2) {
      const [c, b, a] = p;
      L(`${polyMk(p, v)} = 0`);
      if (Math.abs(c) < 1e-12) {
        L(`${v}(${polyMk([b, a], v)}) = 0 (ausklammern)`); L(`${v}_{1} = 0;  ${polyMk([b, a], v)} = 0 ⇒ ${v}_{2} = ${F(-b / a)}`);
        return [0, -b / a].sort((x, y) => x - y);
      }
      if (Math.abs(b) < 1e-12) {
        const r = -c / a; L(Math.abs(a - 1) < 1e-12 ? `${v}^{2} = ${F(r)}` : `${polyMk([0, 0, a], v)} = ${F(-c)} ⇒ ${v}^{2} = ${F(r)}`);
        if (r < 0) { L(`${v}^{2} < 0 ⇒ keine reelle Lösung.`); return []; }
        L(`${v}_{1,2} = ± \\sqrt{${F(r)}} ${relF(Math.sqrt(r))} ± ${F(Math.sqrt(r))}`);
        return [-Math.sqrt(r), Math.sqrt(r)];
      }
      const Dis = b * b - 4 * a * c;
      L(`${v}_{1,2} = \\frac{−b ± \\sqrt{b^{2} − 4ac}}{2a}   (a = ${F(a)}; b = ${F(b)}; c = ${F(c)})`);
      L(`${v}_{1,2} = \\frac{${b < 0 ? F(-b) : '−' + F(b)} ± \\sqrt{${PF(b)}^{2} − 4 · ${PF(a)} · ${PF(c)}}}{2 · ${PF(a)}} = \\frac{${F(-b)} ± \\sqrt{${F(Dis)}}}{${F(2 * a)}}`);
      if (Dis < -1e-12) { L(`Diskriminante ${F(Dis)} < 0 ⇒ keine reelle Lösung.`); return []; }
      if (Math.abs(Dis) < 1e-12) { const x = -b / (2 * a); L(`Diskriminante = 0 ⇒ eine Lösung: ${v} = ${F(x)}`); return [x]; }
      const sd = Math.sqrt(Dis); const x1 = (-b + sd) / (2 * a), x2 = (-b - sd) / (2 * a);
      const sdS = isInt(sd) || toFrac(sd, 12) ? F(sd) : null;
      if (sdS) L(`${v}_{1,2} = \\frac{${F(-b)} ± ${sdS}}{${F(2 * a)}}`);
      L(`${v}_{1} ${relF(x1)} ${F(x1)};   ${v}_{2} ${relF(x2)} ${F(x2)}`);
      return [x1, x2].sort((x, y) => x - y);
    }
    // Grad ≥ 3
    let k = 0; while (Math.abs(p[k]) < 1e-12) k++;
    if (k > 0) {
      const rest = p.slice(k);
      L(`${polyMk(p, v)} = 0`);
      L(`${v}${k > 1 ? `^{${k}}` : ''} · (${polyMk(rest, v)}) = 0 (ausklammern)`);
      L(`⇒ ${v} = 0  oder  ${polyMk(rest, v)} = 0`);
      const r = solvePoly(rest, out, v, ind) || [];
      return [...new Set([0, ...r].map(x => Math.round(x * 1e9) / 1e9))].sort((x, y) => x - y);
    }
    // biquadratisch
    if (d === 4 && Math.abs(p[1]) < 1e-12 && Math.abs(p[3]) < 1e-12) {
      L(`${polyMk(p, v)} = 0`); L(`Substitution: u = ${v}^{2}`);
      const us = solvePoly([p[0], p[2], p[4]], out, 'u', ind);
      const xs = [];
      (us || []).forEach((uu_, i) => { if (uu_ < -1e-12) L(`u = ${F(uu_)} < 0 ⇒ keine Lösung`); else if (Math.abs(uu_) < 1e-12) { xs.push(0); L(`${v}^{2} = 0 ⇒ ${v} = 0`); } else { xs.push(-Math.sqrt(uu_), Math.sqrt(uu_)); L(`${v}^{2} = ${F(uu_)} ⇒ ${v} = ± ${F(Math.sqrt(uu_))}`); } });
      return xs.sort((x, y) => x - y);
    }
    // ganzzahlige Nullstelle raten + Horner
    const intCoef = p.every(c => isInt(c));
    if (intCoef) {
      const c0 = Math.abs(Math.round(p[0])), an = Math.abs(Math.round(p[d]));
      const divs = n => { const r = []; for (let i = 1; i <= n; i++) if (n % i === 0) r.push(i); return r; };
      const cands = [];
      divs(c0).forEach(pp => divs(an).forEach(qq => { cands.push(pp / qq, -pp / qq); }));
      cands.sort((x, y) => Math.abs(x) - Math.abs(y));
      const r = cands.find(x => Math.abs(pEval(p, x)) < 1e-9);
      if (r !== undefined) {
        L(`${polyMk(p, v)} = 0`);
        L(`Nullstelle durch Probieren: ${v}_{1} = ${F(r)}, denn p(${F(r)}) = 0`);
        // Horner
        const q = []; let acc = 0; for (let i = d; i >= 1; i--) { acc = acc * r + p[i]; q.unshift(acc); }
        L(`Polynomdivision: (${polyMk(p, v)}) : ${xMinus(r, v)} = ${polyMk(q, v)}`);
        const rest = solvePoly(q, out, v, ind) || [];
        return [...new Set([r, ...rest].map(x => Math.round(x * 1e9) / 1e9))].sort((x, y) => x - y);
      }
    }
    // numerisch
    L(`${polyMk(p, v)} = 0`);
    const roots = numRoots(x => pEval(p, x), -1000, 1000);
    L('Keine einfache Lösung ⇒ näherungsweise (Taschenrechner/Graph):');
    return roots;
  }
  function numRoots(f, lo, hi, steps = 20000) {
    const r = []; let x0 = lo, f0 = f(lo);
    for (let i = 1; i <= steps; i++) {
      const x1 = lo + (hi - lo) * i / steps, f1 = f(x1);
      if (Math.abs(f0) < 1e-12) r.push(x0);
      else if (f0 * f1 < 0 && isFinite(f0) && isFinite(f1)) {
        let a = x0, b = x1, fa = f0; for (let k = 0; k < 80; k++) { const m = (a + b) / 2, fm = f(m); if (fa * fm <= 0) b = m; else { a = m; fa = fm; } }
        const m = (a + b) / 2; if (Math.abs(f(m)) < 1e-6) r.push(m);
      }
      x0 = x1; f0 = f1;
    }
    return [...new Set(r.map(x => Math.round(x * 1e8) / 1e8))];
  }

  // =================================================================
  // Modul: Funktionen
  // =================================================================
  function parseFuncDef(it) {
    let m = it.match(/^\s*([a-zA-Z][a-zA-Z0-9_]*)\s*\(\s*x\s*\)\s*=\s*(.+)$/);
    if (m) return { name: m[1], src: m[2] };
    m = it.match(/^\s*([a-zA-Z][a-zA-Z0-9_]*)\s*:\s*y\s*=\s*(.+)$/);
    if (m) return { name: m[1], src: m[2], yform: true };
    m = it.match(/^\s*y\s*=\s*(.+)$/);
    if (m && /x/.test(m[1])) return { name: 'f', src: m[1], yform: true, anon: true };
    return null;
  }
  const nameMk = n => n.replace(/^([a-zA-Z])(\d+)$/, '$1_{$2}');
  function parsePoint(it) {
    const m = it.match(/^\s*([A-Z][A-Za-z0-9_]*)\s*\(\s*([^;|]+?)\s*[;|]\s*([^;|)]+?)\s*\)\s*$/);
    if (!m) return null;
    return { name: m[1], x: evalE(parseExpr(m[2])), y: evalE(parseExpr(m[3])) };
  }
  const ptMk = (n, x, y) => `${nameMk(n)}(${F(x)}; ${F(y)})`;

  function analyseFunc(fd) {
    const ast = parseExpr(fd.src);
    const vs = [...vars(ast)].filter(v => v !== 'x');
    if (vs.length) throw new NotUnderstood(`Unbekannte Variable «${vs[0]}» in der Funktion. Verwende x als Variable.`);
    let poly = toPoly(ast, isX);
    let num = null, den = null;
    if (!poly) {
      const s = strip(ast);
      if (s.t === '/') { num = toPoly(s.a, isX); den = toPoly(s.b, isX); if (num && den) num = pTrim(num), den = pTrim(den); else num = den = null; }
    }
    const f = x => evalE(ast, { x });
    return Object.assign({}, fd, { ast, poly: poly && pTrim(poly), num, den, f, mk: mk(ast), label: fd.yform && !fd.anon ? `${nameMk(fd.name)}: y` : fd.anon ? 'y' : `${nameMk(fd.name)}(x)` });
  }

  function solveFunctions(T, out, funcs, points, params) {
    out.geg([...funcs.map(f => `${f.label} = ${f.mk}`), ...points.map(p => ptMk(p.name, p.x, p.y)), ...Object.keys(params).map(k => `${k} = ${F(params[k])}`)].join(';  '));
    let wants = T.sItems.map(s => s.toLowerCase().replace(/[?]/g, '').trim()).filter(Boolean);
    out.ges(T.sItems.length ? T.sItems.map(s => s.replace(/\?/g, '').trim()).join(';  ') : 'Eigenschaften');
    const f = funcs[0];
    if (!wants.length) {
      if (funcs.length >= 2) wants = ['schnittpunkt'];
      else if (f && f.poly && pDeg(f.poly) === 2) wants = ['nullstellen', 'y-achse', 'scheitelpunkt'];
      else if (f) wants = ['nullstellen', 'y-achse'];
      else if (points.length >= 2) wants = ['geradengleichung'];
    }
    let did = 0;
    for (const w of wants) {
      const done = handleWant(w, funcs, points, params, out);
      if (!done) throw new NotUnderstood(`«${w}» verstehe ich nicht. Möglich: Nullstellen, y-Achsenabschnitt, Schnittpunkt, Steigung, Geradengleichung, Senkrechte, Parallele, Scheitelpunkt, Scheitelform, Grundform, Umkehrfunktion, Definitionsbereich, Wertebereich, Symmetrie, Eigenschaften, f(3).`);
      did++;
    }
    if (!did) throw new Unsolvable('Es ist nicht angegeben, was gesucht ist.', 'Schreibe z. B. «gesucht: Nullstellen».');
  }

  function needFunc(funcs, what) { if (!funcs.length) throw new Unsolvable(`Für «${what}» fehlt die Funktionsgleichung.`, 'Gib z. B. f(x) = 2x² − 8x + 6 an.'); return funcs[0]; }
  function linOf(fn) { if (!fn.poly || pDeg(fn.poly) > 1) return null; return { m: fn.poly[1] || 0, q: fn.poly[0] || 0 }; }

  function nullstellen(fn, out, headline = true) {
    if (headline) out.l(`Nullstellen: ${fn.label.replace(': y', '(x)').replace(/^y$/, 'y')} = 0`);
    if (fn.poly) {
      const r = solvePoly(fn.poly, out, 'x', 1);
      if (r === null) { out.res('Jedes x ist Nullstelle (Nullfunktion).', 1); return; }
      if (!r.length) { out.res(uu('keine Nullstellen'), 1); return; }
      out.res(uu(r.map((x, i) => ptMk(r.length > 1 ? `N${i + 1}` : 'N', x, 0)).join(';  ')), 1);
      return;
    }
    if (fn.num && fn.den) {
      const dz = rootsQuiet(fn.den);
      out.l(`Definitionsbereich: Nenner ≠ 0`, 1);
      if (dz.length) out.l(`${polyMk(fn.den)} = 0 ⇒ x = ${dz.map(F).join('; ')}  ⇒  D = ℝ \\ \\{${dz.map(F).join('; ')}\\}`, 1); else out.l('Nenner wird nie 0 ⇒ D = ℝ', 1);
      out.l('Zähler = 0:', 1);
      const r = solvePoly(fn.num, out, 'x', 1) || [];
      const ok = r.filter(x => !dz.some(z => Math.abs(z - x) < 1e-9));
      const bad = r.filter(x => dz.some(z => Math.abs(z - x) < 1e-9));
      if (bad.length) out.l(`${bad.map(x => 'x = ' + F(x)).join('; ')} liegt nicht in D ⇒ keine Nullstelle`, 1);
      out.res(uu(ok.length ? ok.map((x, i) => ptMk(ok.length > 1 ? `N${i + 1}` : 'N', x, 0)).join(';  ') : 'keine Nullstellen'), 1);
      return;
    }
    const r = numRoots(fn.f, -100, 100);
    out.l('Näherungsweise (numerisch):', 1);
    out.res(uu(r.length ? r.map((x, i) => `x_{${i + 1}} ≈ ${D(x)}`).join(';  ') : 'keine Nullstellen gefunden'), 1);
  }
  function rootsQuiet(p) { const o = new Out(); return solvePoly(p, o) || []; }

  function yAchse(fn, out) {
    out.l('Schnittpunkt mit der y-Achse: x = 0 setzen');
    let v; try { v = fn.f(0); } catch (e) { v = NaN; }
    if (!isFinite(v)) { out.res(uu('x = 0 liegt nicht im Definitionsbereich ⇒ kein Schnittpunkt'), 1); return; }
    out.l(`${fn.label.includes(':') || fn.label === 'y' ? 'y' : nameMk(fn.name) + '(0)'} = ${mk(substX(fn.ast, 0))}`, 1);
    out.res(uu(`${ptMk('S_y', 0, v).replace('S_y', 'S_{y}')}`), 1);
  }
  // x durch Zahl ersetzen (für Einsetz-Zeile)
  function substX(n, val) {
    if (n.t === 'var' && n.n === 'x') { const num = { t: 'num', v: val }; return val < 0 ? { t: 'par', a: { t: 'neg', a: { t: 'num', v: -val } } } : num; }
    const c = Object.assign({}, n); if (n.a) c.a = substX(n.a, val); if (n.b) c.b = substX(n.b, val);
    if (c.t === '*' && c.imp && (c.b.t === 'num' || c.b.t === 'par')) c.imp = false;
    return c;
  }
  function substFrac(n, val) {
    // wie substX, aber Bruchdarstellung
    const fr = toFrac(val, 30);
    if (n.t === 'var' && n.n === 'x') {
      if (fr && fr.d !== 1) { const node = { t: '/', a: { t: 'num', v: Math.abs(fr.n) }, b: { t: 'num', v: fr.d } }; return { t: 'par', a: val < 0 ? { t: 'neg', a: node } : node }; }
      return val < 0 ? { t: 'par', a: { t: 'neg', a: { t: 'num', v: -val } } } : { t: 'num', v: val };
    }
    const c = Object.assign({}, n); if (n.a) c.a = substFrac(n.a, val); if (n.b) c.b = substFrac(n.b, val);
    if (c.t === '*' && c.imp) c.imp = false;
    return c;
  }

  function handleWant(w, funcs, points, params, out) {
    const fn = funcs[0];
    const fnName = f => (f.label.endsWith(': y') || f.label === 'y' ? 'y' : nameMk(f.name) + '(x)');
    // Funktionswert f(3)
    let m = w.match(/^([a-z][a-z0-9]*)\s*\(\s*([^)]+)\)$/i);
    if (m && m[2].trim() !== 'x') {
      const f = funcs.find(g => g.name.toLowerCase() === m[1].toLowerCase()) || needFunc(funcs, 'Funktionswert');
      const xv = evalE(parseExpr(m[2])); const v = f.f(xv);
      out.l(`Funktionswert: ${nameMk(f.name)}(${F(xv)}) = ${mk(substFrac(f.ast, xv))}`);
      out.res(uu(`${nameMk(f.name)}(${F(xv)}) ${relF(v)} ${F(v)}`), 1); return true;
    }
    if (/^(nullstelle|nullstellen|schnittpunkte? mit (der )?x-achse|x-achse)$/.test(w)) { nullstellen(needFunc(funcs, 'Nullstellen'), out); return true; }
    if (/^(ordinatenabschnitt|y-achsenabschnitt|achsenabschnitt|schnittpunkte? mit (der )?y-achse|y-achse|q)$/.test(w)) { yAchse(needFunc(funcs, 'y-Achsenabschnitt'), out); return true; }
    if (/^(schnittpunkte? mit (den )?achsen|achsenschnittpunkte|achsen)$/.test(w) || (/^schnittpunkte?$/.test(w) && funcs.length === 1)) { const f = needFunc(funcs, 'Schnittpunkte'); nullstellen(f, out); yAchse(f, out); return true; }
    if (/^schnittpunkte?$/.test(w) || /^schnittpunkt(e)? (von|der|zweier)/.test(w)) {
      if (funcs.length < 2) throw new Unsolvable('Für einen Schnittpunkt braucht es zwei Funktionen.', 'Es fehlt die zweite Funktionsgleichung.');
      const [f1, f2] = funcs;
      out.l(`Schnittpunkt: ${fnName(f1).replace('y', nameMk(f1.name) + '(x)')} = ${fnName(f2).replace('y', nameMk(f2.name) + '(x)')}`);
      out.l(`${f1.mk} = ${f2.mk}`, 1);
      if (f1.poly && f2.poly) {

      bg = `<path d="${Hand.paperLines(st.paper, st.size).map(l => `M${l[0][0]} ${l[0][1]}L${l[1][0]} ${l[1][1]}`).join('')}" stroke="#9EC4E6" stroke-width="${st.paper === 'grid' ? 0.12 : 0.18}" fill="none"/>`;
      if (st.paper === 'grid') bg += `<path d="M${Hand.MARGIN_X} 10V287" stroke="#D97373" stroke-width="0.2" fill="none"/>`;
    }
    const pathD = list => { let d = ''; for (const s of list) { if (!s.length) continue; d += 'M' + s[0][0].toFixed(2) + ' ' + s[0][1].toFixed(2); if (s.length === 1) d += 'l0.05 0'; for (let i = 1; i < s.length; i++) d += 'L' + s[i][0].toFixed(2) + ' ' + s[i][1].toFixed(2); } return d; };
    const groups = p.groups || { _: p.strokes };
    const rest = []; Object.keys(groups).forEach(k => { if (k !== animateId) rest.push(...groups[k]); });
    const d = pathD(rest);
    const dNew = animateId && groups[animateId] ? pathD(groups[animateId]) : '';
    const hits = p.hits.map(h => `<rect class="hit${h.id === selected ? ' on' : ''}" data-id="${h.id}" x="${Hand.MARGIN_X - 2}" y="${(h.y0).toFixed(2)}" width="${210 - Hand.MARGIN_X - 8}" height="${Math.max(4, h.y1 - h.y0).toFixed(2)}" rx="1.5"><title>Antippen zum Auswählen</title></rect>`).join('');
    const brk = p.hits.filter(h => h.isBreak).map(h => `<text x="105" y="${(h.y0 + 3).toFixed(1)}" font-size="2.6" fill="#8A96A8" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">Seitenumbruch</text>`).join('');
    return `<svg viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Seite ${idx + 1}">${bg}<path d="${d}" stroke="${INK_CSS[st.ink] || INK_CSS.blue}" stroke-width="${strokeW()}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${dNew ? `<path class="draw" d="${dNew}" stroke="${INK_CSS[st.ink] || INK_CSS.blue}" stroke-width="${strokeW()}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : ''}${brk}${hits}</svg>`;
  }
  function pageWidthPx() {
    const avail = $('ws').clientWidth - 32;
    const full = 210 * 96 / 25.4;
    if (zoom === 'fit') return Math.max(280, Math.min(avail, full * 1.25));
    return full * zoom;
  }
  function render() {
    const st = state.settings;
    // Ribbon-Zustand
    setSeg('segSize', st.size); setSeg('segSep', st.sep); setSeg('segAng', st.rad ? 'rad' : 'deg'); setSeg('segPaper', st.paper); setSeg('segTheme', st.theme || 'system');
    document.querySelectorAll('.swatch').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ink === st.ink)));
    $('decVal').textContent = st.dec;
    $('docTitle').value = state.title;
    $('undo').disabled = !past.length; $('redo').disabled = !future.length;
    applyTheme();
    const items = buildItems();
    layout = Hand.layoutDoc(items, { size: st.size });
    const w = pageWidthPx();
    const html = layout.map((p, i) => `<div class="page" style="width:${w}px">${pageSvg(p, i)}</div>`).join('');
    const zone = $('zone'); if (zone.parentNode) zone.parentNode.removeChild(zone);
    // Platz für die Schreibzone: 3 Zeilen
    const zoneH = layout.lh * 3.2;
    let zPage = layout.end.page, zTop = layout.end.y + (state.items.length ? layout.sz * 1.4 : 0);
    let extra = '';
    if (zTop + zoneH > Hand.PAGE_H - Hand.M.bottom) { zPage = layout.length; zTop = Hand.M.top; extra = `<div class="page" style="width:${w}px">${pageSvg({ strokes: [], hits: [], groups: {} }, layout.length)}</div>`; }
    $('pages').innerHTML = html + extra;
    const host = $('pages').children[zPage];
    host.appendChild(zone); zone.hidden = false;
    const pxmm = w / 210;
    zone.style.left = ((Hand.M.left - 3) / 210 * 100) + '%';
    zone.style.right = ((Hand.M.right - 3) / 210 * 100) + '%';
    zone.style.top = (zTop / 297 * 100) + '%';
    inp.style.fontSize = (layout.sz * 1.55 * pxmm) + 'px';
    inp.style.lineHeight = (layout.lh * pxmm) + 'px';
    inp.style.minHeight = (zoneH * pxmm) + 'px';
    $('zoneTag').textContent = editing ? 'Bearbeiten: ' + ($('selName').textContent || 'Aufgabe') : noteMode ? 'Notiz schreiben' : 'Hier schreiben';
    $('solve').textContent = editing ? 'Übernehmen' : noteMode ? 'Einfügen' : 'Lösen';
    autoGrow();
    runAnimation();
    const tasks = state.items.filter(i => i.type === 'task').length;
    $('stPages').textContent = `Seite ${layout.length > 1 ? '1–' + layout.length : '1'} von ${layout.length}`;
    $('stTasks').textContent = `${tasks} ${tasks === 1 ? 'Aufgabe' : 'Aufgaben'}${state.sample ? ' · Beispiele (Datei › Neu leert das Blatt)' : ''}`;
    $('stZoom').textContent = zoom === 'fit' ? 'Seitenbreite' : Math.round(zoom * 100) + ' %';
    updateSelBar(items);
  }
  function runAnimation() {
    if (!animateId) return;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('path.draw').forEach((p, i) => {
      if (reduce) return;
      let len = 0; try { len = p.getTotalLength(); } catch (e) { return; }
      const dur = Math.min(4.5, Math.max(1.2, len / 260));
      p.style.strokeDasharray = len + ' ' + len; p.style.strokeDashoffset = len; p.style.setProperty('--dur', dur + 's');
      p.getBoundingClientRect();
      requestAnimationFrame(() => requestAnimationFrame(() => { p.style.strokeDashoffset = '0'; }));
    });
    animateId = null;
  }
  function setSeg(id, v) { document.querySelectorAll('#' + id + ' button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); }
  function applyTheme() { const t = state.settings.theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else if (document.documentElement.hasAttribute('data-theme') && window.__themeByApp) document.documentElement.removeAttribute('data-theme'); window.__themeByApp = t === 'light' || t === 'dark'; }

  // ---- Auswahl ----
  function updateSelBar(items) {
    const bar = $('selBar');
    if (!selected || !state.items.find(i => i.id === selected)) { selected = null; bar.hidden = true; return; }
    const it = state.items.find(i => i.id === selected); const built = (items || buildItems()).find(i => i.id === selected);
    $('selName').textContent = it.type === 'task' ? (built && built.label) || 'Aufgabe' : it.type === 'text' ? 'Notiz' : it.type === 'break' ? 'Seitenumbruch' : 'Leerzeile';
    $('sEdit').hidden = !(it.type === 'task' || it.type === 'text');
    bar.hidden = false;
  }
  $('pages').addEventListener('click', e => {
    const r = e.target.closest('.hit'); if (!r) return;
    selected = selected === r.dataset.id ? null : r.dataset.id;
    document.querySelectorAll('.hit').forEach(h => h.classList.toggle('on', h.dataset.id === selected));
    updateSelBar();
  });
  $('pages').addEventListener('dblclick', e => { const r = e.target.closest('.hit'); if (r) { selected = r.dataset.id; startEdit(); } });
  $('sClose').onclick = () => { selected = null; if (editing) inp.value = ''; editing = null; render(); };
  $('sDel').onclick = () => { const id = selected; commit(() => { state.items = state.items.filter(i => i.id !== id); }); selected = null; updateSelBar(); toast('Gelöscht', 'Rückgängig', undo); };
  $('sUp').onclick = () => move(-1); $('sDown').onclick = () => move(1);
  function move(dir) { const i = state.items.findIndex(x => x.id === selected); const j = i + dir; if (i < 0 || j < 0 || j >= state.items.length) return; commit(() => { const a = state.items; [a[i], a[j]] = [a[j], a[i]]; }); }
  $('sEdit').onclick = startEdit;
  function startEdit() { const it = state.items.find(i => i.id === selected); if (!it || !(it.type === 'task' || it.type === 'text')) return; editing = it.id; render(); inp.value = it.input; autoGrow(); focusZone(); msg(it.type === 'text' ? 'Notiz bearbeiten, dann «Übernehmen»' : 'Aufgabe bearbeiten, dann «Übernehmen»', true); }
  function focusZone() { const z = $('zone'); z.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); setTimeout(() => inp.focus({ preventScroll: true }), 250); }

  // ---- Eingabe ----
  function autoGrow() { inp.style.height = 'auto'; inp.style.height = inp.scrollHeight + 2 + 'px'; }
  inp.addEventListener('input', autoGrow);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
    if (e.key === 'Escape' && (editing || noteMode)) { editing = null; noteMode = false; inp.value = ''; render(); msg(''); }
  });
  $('solve').onclick = submit;
  function msg(t, ok) { const m = $('msg'); m.textContent = t; m.classList.toggle('ok', !!ok); }
  function nextNumber() { let n = 0; for (const it of state.items) { if (it.type !== 'task') continue; const num = numberOf(it); n = num && /^\d+$/.test(num) ? +num : n + 1; } return n + 1; }
  async function submit() {
    const raw = inp.value.trim(); if (!raw) { msg('Schreibe eine Aufgabe, z. B. «geg.: a = 7 cm, b = 5 cm, γ = 40° ges.: c».'); return; }
    if (editing) {
      const it = state.items.find(i => i.id === editing);
      if (it && it.type === 'task') { const r = Engine.solveTask(raw, state.settings); if (!r.ok) { msg(r.error); return; } }
      editing = null; animateId = it.id; inp.value = ''; commit(() => { it.input = raw; }); msg('Aktualisiert', true); return;
    }
    if (noteMode) { const nid = uid(); noteMode = false; inp.value = ''; animateId = nid; commit(() => insertItems([{ id: nid, type: 'text', input: raw }])); msg('Notiz eingefügt', true); return; }
    // mehrere Aufgaben auf einmal (neue Zeile + «Aufgabe n»)
    const parts = raw.split(/\n(?=\s*(?:aufgabe|aufg\.?)\s*\d)/i).map(s => s.trim()).filter(Boolean);
    const newItems = []; let n = state.sample ? 1 : nextNumber();
    for (const p of parts) {
      const r = Engine.solveTask(p, state.settings);
      if (!r.ok) { msg((parts.length > 1 ? `«${p.slice(0, 40)}…»: ` : '') + r.error); if (!newItems.length) return; break; }
      const hasNum = /^\s*(aufgabe|aufg\.?|nr\.?)\s*[0-9a-z]/i.test(p);
      newItems.push({ id: uid(), type: 'task', input: hasNum ? p : `Aufgabe ${n}: ${p}` });
      n = hasNum ? (parseInt((p.match(/\d+/) || [n])[0], 10) + 1) : n + 1;
    }
    const wasSample = state.sample;
    const zone = $('zone'); zone.classList.add('sink');
    await new Promise(r => setTimeout(r, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 420));
    zone.classList.remove('sink'); inp.value = '';
    animateId = newItems[newItems.length - 1].id;
    commit(() => { if (wasSample) { state.items = []; state.title = 'Mathe Hausaufgaben'; } insertItems(newItems); });
    const last = newItems[newItems.length - 1]; const res = Engine.solveTask(last.input, state.settings);
    msg(res.unsolvable ? `${newItems.length > 1 ? newItems.length + ' Aufgaben eingefügt. ' : ''}Eingetragen als «nicht lösbar», es fehlen Angaben.` : `${newItems.length > 1 ? newItems.length + ' Aufgaben' : 'Aufgabe'} gelöst und eingetragen.`, !res.unsolvable);
    if (wasSample) toast('Beispiele entfernt, dein Blatt beginnt jetzt', 'Rückgängig', undo);
    requestAnimationFrame(() => scrollToItem(last.id));
  }
  function insertItems(list) {
    const i = selected ? state.items.findIndex(x => x.id === selected) : -1;
    if (i >= 0) state.items.splice(i + 1, 0, ...list); else state.items.push(...list);
  }
  function scrollToItem(id) { const r = document.querySelector(`.hit[data-id="${id}"]`); if (r) r.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  let noteMode = false;
  const PH = inp.placeholder;
  function setNoteMode(on) { noteMode = on; inp.placeholder = on ? 'Text, der ohne Rechnung in deiner Handschrift aufs Blatt kommt' : PH; $('zoneTag').textContent = on ? 'Notiz schreiben' : 'Hier schreiben'; $('solve').textContent = on ? 'Einfügen' : 'Lösen'; }

  // Sonderzeichen
  $('symbols').innerHTML = SYMBOLS.map(s => `<button type="button" data-s="${s}">${s.trim()}</button>`).join('');
  $('symbols').addEventListener('pointerdown', e => { if (e.target.closest('button')) e.preventDefault(); });
  $('symbols').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; insertAtCursor(b.dataset.s); });
  function insertAtCursor(s) { const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? a; inp.value = inp.value.slice(0, a) + s + inp.value.slice(b); inp.selectionStart = inp.selectionEnd = a + s.length; inp.focus(); autoGrow(); }

  // ---- Ribbon ----
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x === t)));
    document.querySelectorAll('.panel').forEach(p => { p.hidden = p.dataset.panel !== t.dataset.tab; });
  }));
  const segHandler = (id, fn) => document.querySelectorAll('#' + id + ' button').forEach(b => b.addEventListener('click', () => fn(b.dataset.v)));
  segHandler('segSize', v => commit(() => { state.settings.size = v; }));
  segHandler('segSep', v => commit(() => { state.settings.sep = v; }));
  segHandler('segAng', v => commit(() => { state.settings.rad = v === 'rad'; }));
  segHandler('segPaper', v => commit(() => { state.settings.paper = v; }));
  segHandler('segTheme', v => { state.settings.theme = v; if (v === 'system') document.documentElement.removeAttribute('data-theme'); render(); persist(); });
  document.querySelectorAll('.swatch').forEach(b => b.addEventListener('click', () => commit(() => { state.settings.ink = b.dataset.ink; })));
  $('decMinus').onclick = () => { if (state.settings.dec > 0) commit(() => { state.settings.dec--; }); };
  $('decPlus').onclick = () => { if (state.settings.dec < 6) commit(() => { state.settings.dec++; }); };
  $('docTitle').addEventListener('change', e => commit(() => { state.title = e.target.value.trim() || 'Rechenheft'; }));
  $('undo').onclick = undo; $('redo').onclick = redo;
  document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && document.activeElement !== inp) { e.preventDefault(); e.shiftKey ? redo() : undo(); } });

  let newArmed = null;
  $('bNew').onclick = () => {
    if (!newArmed) { $('bNew').classList.add('warn'); $('bNewLbl').textContent = 'Wirklich leeren?'; newArmed = setTimeout(disarm, 3500); return; }
    disarm(); commit(() => { state.items = []; state.title = 'Mathe Hausaufgaben'; }); selected = null; toast('Neues leeres Blatt', 'Rückgängig', undo); focusZone();
  };
  function disarm() { clearTimeout(newArmed); newArmed = null; $('bNew').classList.remove('warn'); $('bNewLbl').textContent = 'Neu'; }
  $('bNote').onclick = () => { setNoteMode(true); focusZone(); msg('Notiz-Modus: Text kommt ohne Rechnung aufs Blatt.', true); };
  $('goWrite').onclick = focusZone;
  $('bGap').onclick = () => commit(() => insertItems([{ id: uid(), type: 'gap' }]));
  $('bBreak').onclick = () => commit(() => insertItems([{ id: uid(), type: 'break' }]));
  $('zIn').onclick = $('stIn').onclick = () => { zoom = Math.min(2, (zoom === 'fit' ? pageWidthPx() / (210 * 96 / 25.4) : zoom) + 0.1); render(); };
  $('zOut').onclick = $('stOut').onclick = () => { zoom = Math.max(0.4, (zoom === 'fit' ? pageWidthPx() / (210 * 96 / 25.4) : zoom) - 0.1); render(); };
  $('zFit').onclick = () => { zoom = 'fit'; render(); };
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (zoom === 'fit') document.querySelectorAll('.page').forEach(p => { p.style.width = pageWidthPx() + 'px'; }); }, 120); });

  // Vorlagen-Menü
  let menuEl = null;
  function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
  $('bExamples').onclick = e => {
    if (menuEl) return closeMenu();
    menuEl = document.createElement('div'); menuEl.className = 'menu';
    menuEl.innerHTML = EXAMPLES.map(([h, list]) => `<h4>${h}</h4>` + list.map(([n, t]) => `<button data-t="${t.replace(/"/g, '&quot;')}">${n}<small>${t}</small></button>`).join('')).join('');
    document.body.appendChild(menuEl);
    const r = $('bExamples').getBoundingClientRect(); menuEl.style.left = Math.max(16, Math.min(r.left, innerWidth - menuEl.offsetWidth - 16)) + 'px'; menuEl.style.top = (r.bottom + 4) + 'px';
    menuEl.addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; setNoteMode(false); inp.value = b.dataset.t; autoGrow(); focusZone(); closeMenu(); msg('Vorlage eingesetzt: anpassen und «Lösen» tippen.', true); });
    setTimeout(() => document.addEventListener('click', function h(ev) { if (menuEl && !menuEl.contains(ev.target) && ev.target !== $('bExamples')) { closeMenu(); document.removeEventListener('click', h); } }), 0);
  };

  // Hilfe
  $('bHelp').onclick = openHelp;
  function openHelp() {
    const el = document.createElement('div'); el.className = 'help';
    el.innerHTML = `<div class="help-card" role="dialog" aria-label="Eingabe-Hilfe"><button class="close">Schliessen</button>
      <h2>So schreibst du Aufgaben</h2>
      <p>Schreibe die Angaben nach <code>geg.:</code> und die gesuchten Grössen nach <code>ges.:</code>. Trenne Angaben mit Komma und Leerzeichen oder mit Semikolon. Dezimalkomma geht: <code>7,5 cm</code>.</p>
      <p>Schreib mit dem Apple Pencil direkt in das gestrichelte Feld auf dem Blatt. Das iPad erkennt deine Schrift (Scribble), dann tippst du «Lösen» und die App schreibt Rechenweg und Lösung in deiner Handschrift darunter. Griechische Buchstaben und ² findest du in der Zeichenleiste, oder du schreibst <code>gamma</code> und <code>x^2</code>.</p>
      <p>Mehrere Aufgaben auf einmal: jede auf eine neue Zeile mit «Aufgabe 1», «Aufgabe 2» … (Zeilenumbruch mit Shift + Enter).</p>
      <p>Fehlen Angaben, schreibt die App den Rechenweg bis dahin, nennt was fehlt und unterstreicht «nicht lösbar» doppelt.</p>
      ${EXAMPLES.map(([h, list]) => `<h3>${h}</h3>` + list.map(([n, t]) => `<button class="ex" data-t="${t.replace(/"/g, '&quot;')}">${t}</button>`).join('')).join('')}
      <h3>Grenzen</h3>
      <p>Textaufgaben («Ein Zug fährt …») wandelt die App offline nicht um. Physik-Formeln sind nicht enthalten, nur dein Mathe-Stoff (Prüfungen 1, 2 und Diplom).</p></div>`;
    document.body.appendChild(el);
    el.addEventListener('click', ev => { if (ev.target === el || ev.target.classList.contains('close')) el.remove(); const b = ev.target.closest('.ex'); if (b) { setNoteMode(false); inp.value = b.dataset.t; autoGrow(); el.remove(); focusZone(); } });
  }

  // ---- Dateien ----
  const safeName = ext => (state.title || 'Rechenheft').replace(/[\\/:*?"<>|]+/g, '-').trim() + ext;
  async function saveFile(name, blob) {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const dl = await window.claude.use('downloads');
        if (dl) { try { await dl.save({ filename: name, data: blob }); toast(`${name} gespeichert`); } catch (e) { if (e && e.code !== 'declined') toast('Speichern nicht möglich: ' + (e.message || e.code)); } return; }
      }
    } catch (e) { /* weiter mit Browser-Methoden */ }
    try {
      const file = new File([blob], name, { type: blob.type });
      if (/iPad|iPhone|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(`${name} erstellt`);
  }
  function exportOpts() { const s = state.settings; return { ink: s.ink, paper: s.paper, size: s.size, strokeW: strokeW() }; }
  async function doPdf() { if (!state.items.length) return toast('Das Blatt ist leer.'); await saveFile(safeName('.pdf'), Export.pdf(layout, exportOpts())); }
  async function doDocx() { if (!state.items.length) return toast('Das Blatt ist leer.'); toast('Word-Datei wird erstellt …'); const b = await Export.docx(layout, exportOpts(), state.title); await saveFile(safeName('.docx'), b); }
  $('bPdf').onclick = doPdf; $('qaPdf').onclick = doPdf; $('bDocx').onclick = doDocx;
  $('bSave').onclick = () => saveFile(safeName('.json'), new Blob([JSON.stringify({ app: 'rechenheft', v: 1, title: state.title, settings: state.settings, items: state.items }, null, 1)], { type: 'application/json' }));
  $('bOpen').onclick = () => $('fileIn').click();
  $('fileIn').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (!Array.isArray(d.items)) throw new Error(); commit(() => { state.items = d.items.map(i => Object.assign({ id: uid() }, i)); state.title = d.title || f.name.replace(/\.[^.]+$/, ''); state.settings = Object.assign(state.settings, d.settings || {}); }); toast(`«${state.title}» geöffnet`); }
    catch (err) { toast('Diese Datei ist keine Rechenheft-Datei (.json aus «Speichern»).'); }
  });

  // ---- Toast ----
  let toastT;
  function toast(text, action, fn) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.innerHTML = `<span></span>`; t.firstChild.textContent = text;
    if (action) { const b = document.createElement('button'); b.textContent = action; b.onclick = () => { fn(); t.remove(); }; t.appendChild(b); }
    document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 4500);
  }

  render();
  if (!state.sample) persist(); else $('stSaved').textContent = '';
  // Offline-Betrieb (nur wenn als eigene Web-App gehostet)
  if ('serviceWorker' in navigator && true) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
})();
</script>
